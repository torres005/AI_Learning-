<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Learning Adventure</title>
    <!-- Custom SVG favicon matching the sparkles logo -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2230%22 fill=%22%232563eb%22/><path d=%22M50 20 L58 42 L80 50 L58 58 L50 80 L42 58 L20 50 L42 42 Z%22 fill=%22%23ffffff%22/></svg>" />
  </head>
  <body>
    <div id="root">
      <!-- Splash Loading Screen -->
      <div style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #F8FAFC;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        z-index: 9999;
      ">
        <div style="
          width: 80px;
          height: 80px;
          border-radius: 24px;
          background: linear-gradient(135deg, #2563eb, #4f46e5);
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
          margin-bottom: 20px;
          animation: pulse 2s infinite ease-in-out;
        ">
          <!-- Sparkles SVG -->
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z"/>
          </svg>
        </div>
        <h1 style="
          font-size: 24px;
          font-weight: 800;
          color: #1e293b;
          margin: 0;
          letter-spacing: -0.03em;
        ">Smart Learning Adventure</h1>
        <p style="
          font-size: 14px;
          font-weight: 500;
          color: #64748b;
          margin-top: 8px;
        ">Entering your learning quest...</p>
        <style>
          @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.9; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
